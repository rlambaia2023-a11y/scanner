[project]
name = "scanner-correcao"
version = "0.1.0"
description = "Fotos de prova -> PDF compacto, ordenado e pesquisável (OCR em português)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# erros reais (pyflakes/pycodestyle), imports, bugs comuns e exceções engolidas
select = ["E", "F", "W", "I", "B", "BLE"]
