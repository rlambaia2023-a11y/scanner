name: verificar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # a mesma do Dockerfile
      - name: Tesseract com português
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Testes (inclui a foto real)
        env:
          OMP_THREAD_LIMIT: "1"
        run: pytest -q
